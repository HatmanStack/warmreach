[tool.ruff]
target-version = "py313"
line-length = 120

exclude = [
    ".git",
    "__pycache__",
    "*.egg-info",
    ".venv",
    "venv",
    "node_modules",
    ".aws-sam",
]

[tool.ruff.lint]
select = [
    "E",
    "W",
    "F",
    "G",
    "I",
    "N",
    "UP",
    "B",
    "SIM",
    "T20",
    "ERA",
]

ignore = [
    "E501",
    "B008",
]

[tool.ruff.format]
quote-style = "single"
indent-style = "space"

[tool.mypy]
# Static type checking for the backend. This locks in the typed-boundary work
# (TypedDicts, Protocols, `str | None`) so it cannot silently regress.
#
# Scope: everything. `scripts/typecheck-backend.sh` runs `mypy -p shared_services`
# plus one invocation per Lambda directory — 24 invocations — and both CI and
# `npm run typecheck:backend` call that script, so they cannot drift apart. The
# per-directory loop is not a style choice: the handlers are all named
# `lambda_function`, so a single pass cannot resolve them. It selects directories
# by "contains any .py", NOT by "contains lambda_function.py", because
# `agent-action-task`'s four Step Functions workers have no file by that name and
# the narrower test skipped them silently.
#
# This used to read "extending the check to the handlers is a future ratchet".
# That is done; the settings below are what is left.
python_version = "3.13"
mypy_path = "lambdas/shared/python"
# Third-party Lambda-layer deps (boto3, requests, yaml, openai, ...) ship no
# stubs in this repo; missing imports are not the type errors we are guarding.
ignore_missing_imports = true
# Meaningful checks that are GREEN on the current tree at introduction. These
# run mypy's default analysis over typed call sites and signatures (catching the
# TypedDict / Protocol / `str | None` boundary regressions this guardrail exists
# to prevent) plus no-implicit-optional, redundant-cast, non-overlapping-equality
# (`strict_equality`), and TypedDict/`**`-unpacking consistency (`extra_checks`).
# Each was verified clean via `mypy -p shared_services` before being enabled;
# `extra_checks` in particular keeps the Phase-0 §7.5 SFN task-event TypedDicts
# (`shared_services/agent_task_events.py`) under stricter consistency checking.
warn_redundant_casts = true
no_implicit_optional = true
strict_equality = true
extra_checks = true
# NOTE: the following stricter checks are intentionally OFF — each still surfaces
# pre-existing errors. Counts below were measured on 2026-07-27 with mypy 2.1.0
# (which is what `requirements-test.lock` pins and therefore what CI runs, despite
# `requirements-test.txt` asking for >=2.3.0). Do not trust these numbers on a tree
# that has moved — re-measure. Run these from `backend/`, one per setting, and read
# mypy's own last line:
#
#   python -m mypy -p shared_services --check-untyped-defs
#   python -m mypy -p shared_services --warn-unused-ignores
#   python -m mypy -p shared_services --warn-unreachable
#   python -m mypy -p shared_services --disallow-untyped-defs
#
# Expected shape: `Found 7 errors in 3 files (checked 60 source files)`. Read the
# "checked N source files" half too — a gate that inspects an empty file set has
# bitten this repo more than once.
#
# The CLI spells these with DASHES; the settings themselves (below, and in the
# names listed here) use underscores. Do not paste an underscored name after `--`:
# mypy answers `mypy: error: unrecognized arguments: --check_untyped_defs` and
# exits 2. That matters because this comment used to pipe the run through
# `grep -c ': error:'`, and that usage message *contains* `: error:` — so the typo
# printed a confident `1` for all four settings instead of failing. Reading mypy's
# own summary cannot fail that way: a usage error produces no `Found N errors`
# line at all.
#
#   check_untyped_defs      7  (2 ragstack_client, 4 cluster_detection_service,
#                               1 warm_intro_paths_service)
#   warn_unused_ignores     2  (observability.py:47,48)
#   warn_unreachable        5  (see below)
#   disallow_untyped_defs   134 — strict mode is a different order of work
#
# On warn_unreachable specifically, because a dead `return` shipped in this
# branch and the gate that would have caught it was measured rather than assumed:
# ruff has no unreachable-code rule at all (`ruff rule unreachable` is not a valid
# rule name on 0.16.0), so mypy is the only lever. The count was 4 while the
# ignore_errors list still existed; draining it moved the number to 5, because
# handler_utils.py:363 was hidden by its entry. That one and the four others are
# mypy narrowing artifacts rather than dead code — e.g. handler_utils' `budget.exhausted`
# is a property that `budget.take()` mutates, which mypy's member narrowing does
# not model — so enabling this flag needs those five rewritten first, not just
# deleted.
#
# The `ignore_errors` module list that used to sit here is GONE: all 15 entries
# were drained. Nothing in shared_services is excluded from error reporting now.
# One of the suppressed errors was load-bearing — edge_ingestion_service's
# `generate_profile_markdown = None` fallback was typed as non-Optional, which made
# its own `is None` guard unreachable, so the ImportError path the try/except exists
# to serve was never checked.
