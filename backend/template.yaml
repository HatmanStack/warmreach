AWSTemplateFormatVersion: '2010-09-09'
Transform: AWS::Serverless-2016-10-31
Description: WarmReach Backend - SAM Template with RAGStack Integration

Parameters:
  Environment:
    Type: String
    Default: prod
    AllowedValues:
      - dev
      - prod
  IncludeDevOrigins:
    Type: String
    Default: 'true'
    AllowedValues:
      - 'true'
      - 'false'
  ProductionOrigins:
    Type: String
    Default: ''
    Description: Comma-separated production origins for CORS (Lambda env vars)
  ProductionOrigin:
    Type: String
    Default: ''
    Description: Primary production origin for S3 CORS (e.g., https://myapp.com)
  OpenAIApiKeyArn:
    Type: String
    Default: ''
    Description: ARN of SSM SecureString parameter containing OpenAI API key
  # RAGStack Integration - Nested Stack (recommended)
  DeployRAGStack:
    Type: String
    Default: 'true'
    AllowedValues:
      - 'true'
      - 'false'
    Description: Deploy RAGStack as nested stack (true) or use external endpoint (false)
  AdminEmail:
    Type: String
    Default: ''
    Description: Admin email for RAGStack deployment (required if DeployRAGStack=true)
    AllowedPattern: '^([\w.+-]+@([\w-]+\.)+[\w-]{2,6})?$'
  # RAGStack Integration - External Endpoint (alternative to nested deployment)
  RagstackGraphqlEndpoint:
    Type: String
    Default: ''
    Description: External RAGStack GraphQL endpoint (used only if DeployRAGStack=false)
  RagstackApiKey:
    Type: String
    Default: ''
    NoEcho: true
    Description: External RAGStack API key (used only if DeployRAGStack=false)
  RagstackTemplateUrl:
    Type: String
    Default: https://ragstack-quicklaunch-public.s3.us-east-1.amazonaws.com/ragstack-template.yaml
    Description: S3 URL of the packaged RAGStack CloudFormation template (used when DeployRAGStack=true)
  ClientDownloadMacUrl:
    Type: String
    Default: ''
    Description: macOS desktop client download URL (https:// or s3://bucket/key)
  ClientDownloadWinUrl:
    Type: String
    Default: ''
    Description: Windows desktop client download URL (https:// or s3://bucket/key)
  ClientDownloadLinuxUrl:
    Type: String
    Default: ''
    Description: Linux desktop client download URL (https:// or s3://bucket/key)
  ClientDownloadVersion:
    Type: String
    Default: ''
    Description: Optional version label shown next to the download buttons
  ClientDownloadBucket:
    Type: String
    Default: ''
    # Only needed when a ClientDownload*Url uses s3://. Naming the bucket lets
    # the grant be scoped to it; left blank, the Lambda gets no S3 permission at
    # all, which is correct for https:// URLs and for platforms not yet
    # published.
    Description: >-
      Bucket holding the desktop client binaries. Required only if a
      ClientDownload*Url uses an s3:// reference.
    AllowedPattern: '^[a-z0-9.\-]*$'
    ConstraintDescription: Must be a valid S3 bucket name, or empty.

  # Logging
  LogRetentionDays:
    Type: Number
    Default: 30
    # Restricted to the retention periods CloudWatch Logs actually accepts;
    # any other value is rejected at deploy time. Tunable per environment so
    # retention can be shortened (PII) or lengthened (audit) without a
    # template edit.
    AllowedValues:
      - 1
      - 3
      - 5
      - 7
      - 14
      - 30
      - 60
      - 90
      - 120
      - 150
      - 180
      - 365
      - 400
      - 545
      - 731
      - 1096
      - 1827
      - 2192
      - 2557
      - 2922
      - 3288
      - 3653
    Description: >-
      Retention for every Lambda log group. LinkedIn profile data, message
      bodies, and email addresses flow through these handlers, so the
      service default of Never Expire is indefinite PII retention.

  RagstackApiKeyArn:
    Type: String
    Default: ''
    Description: >-
      ARN of an SSM SecureString parameter holding the RAGStack API key. When
      set, no plaintext RAGSTACK_API_KEY is injected into any Lambda and the
      value is fetched at runtime through ssm_cache. Leave blank to keep the
      legacy plaintext env var (the fallback logs a warning).

Rules:
  AdminEmailRequiredForRAGStack:
    RuleCondition: !Equals [!Ref DeployRAGStack, 'true']
    Assertions:
      - Assert: !Not [!Equals [!Ref AdminEmail, '']]
        AssertDescription: AdminEmail is required when DeployRAGStack is true

Globals:
  Function:
    Runtime: python3.13
    Timeout: 30
    MemorySize: 512
    Tracing: Active
    Layers:
      - !Ref SharedPythonLayer
    Environment:
      Variables:
        DYNAMODB_TABLE_NAME: !Ref ProfilesTable
        LOG_LEVEL: INFO
        ALLOWED_ORIGINS: !If
          - IncludeDevOriginsCondition
          - !Sub 'http://localhost:5173,http://localhost:3000,${ProductionOrigins}'
          - !Ref ProductionOrigins

Conditions:
  HasRagstackApiKeyArn: !Not [!Equals [!Ref RagstackApiKeyArn, '']]
  HasClientDownloadBucket: !Not [!Equals [!Ref ClientDownloadBucket, '']]
  # Localhost origins require BOTH the opt-in flag AND a dev stack. The flag
  # alone defaulted to 'true' while Environment defaulted to 'prod', so the
  # out-of-the-box deploy was a PRODUCTION stack whose CORS allow-list trusted
  # http://localhost:5173 and :3000 — and with ProductionOrigins left blank, the
  # allow-list was localhost and nothing else. Any page on a developer's machine
  # could call the API with the user's credentials. Failing closed on prod costs
  # a dev stack nothing: Environment=dev still honours the flag.
  IncludeDevOriginsCondition: !And
    - !Equals [!Ref IncludeDevOrigins, 'true']
    - !Equals [!Ref Environment, 'dev']
  HasProductionOrigin: !Not [!Equals [!Ref ProductionOrigin, '']]
  DeployRAGStackCondition: !Equals [!Ref DeployRAGStack, 'true']

Resources:
  # Shared Python Layer for common code (errors, utils, services)
  SharedPythonLayer:
    Type: AWS::Serverless::LayerVersion
    # BuildMethod makes `sam build` explicitly (re)build this layer. Without it,
    # a cached build silently reuses a stale layer version, so shared_services
    # changes never reach the Lambdas that reference the layer.
    Metadata:
      BuildMethod: python3.13
    Properties:
      LayerName: !Sub 'warmreach-shared-python-${Environment}'
      Description: Shared Python utilities for WarmReach Lambdas
      ContentUri: lambdas/shared/
      CompatibleRuntimes:
        - python3.13
      RetentionPolicy: Delete

  # RAGStack-Lambda Nested Stack for semantic search and profile ingestion
  RAGStackNestedStack:
    Type: AWS::CloudFormation::Stack
    Condition: DeployRAGStackCondition
    Properties:
      TemplateURL: !Ref RagstackTemplateUrl
      Parameters:
        StackPrefix: !Sub '${AWS::StackName}-ragstack'
        AdminEmail: !Ref AdminEmail
        BuildDashboard: 'true'
        BuildWebComponent: 'true'
      TimeoutInMinutes: 60
      Tags:
        - Key: Application
          Value: warmreach
        - Key: Environment
          Value: !Ref Environment

  ProfilesTable:
    Type: AWS::DynamoDB::Table
    Properties:
      TableName: !Sub 'warmreach-${Environment}'
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - AttributeName: PK
          AttributeType: S
        - AttributeName: SK
          AttributeType: S
        - AttributeName: GSI1PK
          AttributeType: S
        - AttributeName: GSI1SK
          AttributeType: S
        - AttributeName: GSI3PK
          AttributeType: S
        - AttributeName: GSI3SK
          AttributeType: S
      KeySchema:
        - AttributeName: PK
          KeyType: HASH
        - AttributeName: SK
          KeyType: RANGE
      TimeToLiveSpecification:
        AttributeName: ttl
        Enabled: true
      GlobalSecondaryIndexes:
        - IndexName: GSI1
          KeySchema:
            - AttributeName: GSI1PK
              KeyType: HASH
            - AttributeName: GSI1SK
              KeyType: RANGE
          Projection:
            ProjectionType: ALL
        # GSI3 — kept for single-table schema parity with the pro edition. The
        # Opportunities agent that populates GSI3PK/GSI3SK is pro-only, so this
        # sparse index is always empty in the community edition (no writer sets
        # its keys) and is harmless. Projection ALL mirrors the pro definition.
        - IndexName: GSI3
          KeySchema:
            - AttributeName: GSI3PK
              KeyType: HASH
            - AttributeName: GSI3SK
              KeyType: RANGE
          Projection:
            ProjectionType: ALL
        # NOT kept for parity: the inverted SK/PK index. Pro declares GSI2 and,
        # since the GSI2 -> GSI4 migration, GSI4 alongside it. Both exist solely
        # for `SK = TIER#current` queries in digest-coordinator and
        # admin-metrics, and both of those Lambdas are pro-only (exclude_paths),
        # so the community edition has no reader for either.
        #
        # This is where the parity argument that keeps GSI3 stops applying. GSI3
        # is sparse — no community writer sets its keys, so it stays empty and
        # costs nothing. An inverted SK/PK index is the opposite: EVERY item has
        # an SK, so it would put a second index entry on every single write, to
        # serve nothing. Declining it is deliberate. If a community reader of
        # the inverted index ever appears, add GSI4 (not GSI2) here — the
        # INCLUDE [tier, createdAt] projection is the cheaper shape.

  UserPool:
    Type: AWS::Cognito::UserPool
    Properties:
      UserPoolName: !Sub 'warmreach-${Environment}'
      AutoVerifiedAttributes:
        - email
      UsernameAttributes:
        - email
      Policies:
        PasswordPolicy:
          # 12, not 8, and symbols required. This pool gates stored LinkedIn
          # credentials and the automation that acts on them.
          #
          # A password policy applies to NEW and CHANGED passwords only —
          # existing users are not locked out and are not forced to rotate. That
          # is worth stating, because the opposite reading is the usual reason
          # this change gets refused.
          MinimumLength: 12
          RequireLowercase: true
          RequireNumbers: true
          RequireSymbols: true
          RequireUppercase: true
      # OPTIONAL, not ON. Forcing MFA on an existing pool locks out every
      # current user at their next sign-in; ON is the follow-up once enrolment
      # has been communicated.
      MfaConfiguration: OPTIONAL
      EnabledMfas:
        - SOFTWARE_TOKEN_MFA
      UserPoolAddOns:
        # AUDIT, not ENFORCED. AUDIT records compromised-credential and
        # adaptive-auth signals without blocking anyone, and AdvancedSecurityMode
        # carries a per-MAU cost; ENFORCED is the follow-up once the signal is
        # understood.
        AdvancedSecurityMode: AUDIT

  UserPoolClient:
    Type: AWS::Cognito::UserPoolClient
    Properties:
      ClientName: !Sub 'warmreach-client-${Environment}'
      UserPoolId: !Ref UserPool
      ExplicitAuthFlows:
        - ALLOW_USER_SRP_AUTH
        - ALLOW_REFRESH_TOKEN_AUTH
      GenerateSecret: false
      TokenValidityUnits:
        AccessToken: hours
        IdToken: hours
        RefreshToken: days
      AccessTokenValidity: 4
      IdTokenValidity: 4
      RefreshTokenValidity: 30

  HttpApi:
    Type: AWS::Serverless::HttpApi
    Properties:
      StageName: !Ref Environment
      CorsConfiguration:
        AllowOrigins: !If
          - HasProductionOrigin
          - !If
            - IncludeDevOriginsCondition
            - - http://localhost:5173
              - http://localhost:3000
              - !Ref ProductionOrigin
            - - !Ref ProductionOrigin
          - - http://localhost:5173
            - http://localhost:3000
        AllowHeaders:
          - Content-Type
          - Authorization
          - X-Amz-Date
          - X-Api-Key
          - X-Amz-Security-Token
        AllowMethods:
          - GET
          - POST
          - PUT
          - DELETE
          - OPTIONS
        AllowCredentials: true
      Auth:
        DefaultAuthorizer: CognitoAuthorizer
        Authorizers:
          CognitoAuthorizer:
            IdentitySource: $request.header.Authorization
            JwtConfiguration:
              issuer: !Sub 'https://cognito-idp.${AWS::Region}.amazonaws.com/${UserPool}'
              audience:
                - !Ref UserPoolClient
      # Default applies to every route without an override below. Raised from
      # 10/5: one shared 5 rps bucket across all 22 routes and all users meant
      # one tenant's burst starved every other. Kept below the pro defaults
      # because a community deployment is single-tenant.
      #
      # NOT per-tenant. HTTP APIs have no usage plans or API keys, so genuine
      # per-tenant isolation needs a REST migration or a Lambda-authorizer token
      # bucket. This raises the ceiling and differentiates routes by cost.
      DefaultRouteSettings:
        ThrottlingBurstLimit: 100
        ThrottlingRateLimit: 50
      RouteSettings:
        # Expensive and abuse-sensitive: spends money (OpenAI) or drives a real
        # LinkedIn action.
        'POST /llm':
          ThrottlingBurstLimit: 20
          ThrottlingRateLimit: 10
        'POST /linkedin-actions':
          ThrottlingBurstLimit: 20
          ThrottlingRateLimit: 10
        'POST /commands':
          ThrottlingBurstLimit: 40
          ThrottlingRateLimit: 20
        # Read-heavy dashboard traffic: cheap per call and bursty by nature.
        'GET /dynamodb':
          ThrottlingBurstLimit: 200
          ThrottlingRateLimit: 100
        'POST /dynamodb':
          ThrottlingBurstLimit: 200
          ThrottlingRateLimit: 100
        'POST /edges':
          ThrottlingBurstLimit: 200
          ThrottlingRateLimit: 100
        'GET /profiles':
          ThrottlingBurstLimit: 200
          ThrottlingRateLimit: 100

  # ==========================================================================
  # WebSocket API for real-time client-backend communication
  # ==========================================================================
  WebSocketApi:
    Type: AWS::ApiGatewayV2::Api
    Properties:
      Name: !Sub 'warmreach-websocket-${Environment}'
      ProtocolType: WEBSOCKET
      RouteSelectionExpression: $request.body.action

  WebSocketStage:
    Type: AWS::ApiGatewayV2::Stage
    Properties:
      ApiId: !Ref WebSocketApi
      StageName: !Ref Environment
      AutoDeploy: true

  # IAM role for Lambdas to call @connections management API
  WebSocketManageConnectionsRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: !Sub 'warmreach-ws-manage-${Environment}'
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              Service: lambda.amazonaws.com
            Action: sts:AssumeRole
      ManagedPolicyArns:
        - arn:aws:iam::aws:policy/service-role/AWSLambdaBasicExecutionRole
      Policies:
        - PolicyName: ManageConnections
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Effect: Allow
                Action:
                  - execute-api:ManageConnections
                Resource: !Sub 'arn:aws:execute-api:${AWS::Region}:${AWS::AccountId}:${WebSocketApi}/${Environment}/*'
        - PolicyName: DynamoDBAccess
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Effect: Allow
                Action:
                  - dynamodb:PutItem
                  - dynamodb:GetItem
                  - dynamodb:UpdateItem
                  - dynamodb:DeleteItem
                  - dynamodb:Query
                  - dynamodb:TransactWriteItems
                  - dynamodb:TransactGetItems
                Resource:
                  - !GetAtt ProfilesTable.Arn
                  - !Sub '${ProfilesTable.Arn}/index/*'

  # ==========================================================================
  # Lambda log groups
  # ==========================================================================
  # Every Lambda below has an explicit log group. Left implicit, the Lambda
  # service creates /aws/lambda/<name> on first invoke with retention "Never
  # Expire" and the group is NOT stack-managed, so `sam delete` orphans it.
  #
  # Two rules that look like they could be simplified, and must not be:
  #
  # 1. Each LogGroupName REPEATS its function's own literal FunctionName
  #    expression. `!Sub '/aws/lambda/${FunctionName}'` does NOT resolve —
  #    ${...} inside !Sub resolves against template parameters and resource
  #    logical IDs, and there is no FunctionName parameter or logical ID.
  # 2. The tempting alternative, `!Sub '/aws/lambda/${SomeFunction}'` (the
  #    logical ID, which does resolve to the function name), creates an implicit
  #    log-group -> function dependency while the function's DependsOn points
  #    back at the group. That is a circular dependency and the stack will not
  #    deploy. The literal repetition is the only form compatible with the
  #    DependsOn the ordering hazard below requires.
  #
  # DependsOn on each function is what prevents the ordering hazard: a Lambda
  # invoked before its explicit group exists makes the service create the group
  # implicitly, and the next deploy then fails with "already exists".
  #
  # DeletionPolicy: Delete is deliberate and differs from ProfilesTable's
  # Retain — the entire point is that `sam delete` must not leave these behind.

  WebSocketConnectLogGroup:
    Type: AWS::Logs::LogGroup
    DeletionPolicy: Delete
    Properties:
      LogGroupName: !Sub '/aws/lambda/warmreach-ws-connect-${Environment}'
      RetentionInDays: !Ref LogRetentionDays

  WebSocketDisconnectLogGroup:
    Type: AWS::Logs::LogGroup
    DeletionPolicy: Delete
    Properties:
      LogGroupName: !Sub '/aws/lambda/warmreach-ws-disconnect-${Environment}'
      RetentionInDays: !Ref LogRetentionDays

  WebSocketDefaultLogGroup:
    Type: AWS::Logs::LogGroup
    DeletionPolicy: Delete
    Properties:
      LogGroupName: !Sub '/aws/lambda/warmreach-ws-default-${Environment}'
      RetentionInDays: !Ref LogRetentionDays

  CommandDispatchLogGroup:
    Type: AWS::Logs::LogGroup
    DeletionPolicy: Delete
    Properties:
      LogGroupName: !Sub '/aws/lambda/warmreach-command-dispatch-${Environment}'
      RetentionInDays: !Ref LogRetentionDays

  LinkedinActionGateLogGroup:
    Type: AWS::Logs::LogGroup
    DeletionPolicy: Delete
    Properties:
      LogGroupName: !Sub '/aws/lambda/warmreach-linkedin-action-gate-${Environment}'
      RetentionInDays: !Ref LogRetentionDays

  EdgeCrudLogGroup:
    Type: AWS::Logs::LogGroup
    DeletionPolicy: Delete
    Properties:
      LogGroupName: !Sub '/aws/lambda/warmreach-edge-crud-${Environment}'
      RetentionInDays: !Ref LogRetentionDays

  RagstackOpsLogGroup:
    Type: AWS::Logs::LogGroup
    DeletionPolicy: Delete
    Properties:
      LogGroupName: !Sub '/aws/lambda/warmreach-ragstack-ops-${Environment}'
      RetentionInDays: !Ref LogRetentionDays

  DynamoDBApiLogGroup:
    Type: AWS::Logs::LogGroup
    DeletionPolicy: Delete
    Properties:
      LogGroupName: !Sub '/aws/lambda/warmreach-dynamodb-api-${Environment}'
      RetentionInDays: !Ref LogRetentionDays

  LLMLogGroup:
    Type: AWS::Logs::LogGroup
    DeletionPolicy: Delete
    Properties:
      LogGroupName: !Sub '/aws/lambda/warmreach-llm-${Environment}'
      RetentionInDays: !Ref LogRetentionDays

  ResearchReconcilerLogGroup:
    Type: AWS::Logs::LogGroup
    DeletionPolicy: Delete
    Properties:
      LogGroupName: !Sub '/aws/lambda/warmreach-research-reconciler-${Environment}'
      RetentionInDays: !Ref LogRetentionDays

  ClientDownloadsLogGroup:
    Type: AWS::Logs::LogGroup
    DeletionPolicy: Delete
    Properties:
      LogGroupName: !Sub '/aws/lambda/warmreach-client-downloads-${Environment}'
      RetentionInDays: !Ref LogRetentionDays

  # --------------------------------------------------------------------------
  # Circuit-breaker persistence failures
  # --------------------------------------------------------------------------
  # shared_services/circuit_breaker.py keeps its state writes best-effort — a
  # breaker that cannot persist must not break the caller's code — but a
  # swallowed write silently degrades the breaker into a no-op. It now logs the
  # literal CIRCUIT_BREAKER_PERSIST_FAILED, and these filters turn that into a
  # metric. The marker is in the log MESSAGE rather than a structured `extra`
  # field on purpose: observability.StructuredJsonFormatter filters `extra`
  # through an allowlist, so a field an alarm keyed on would never be emitted.
  #
  # One filter per log group that actually runs a breaker, i.e. every Lambda
  # that constructs a RAGStackClient. They all publish the same metric, so the
  # alarm below covers all of them.

  EdgeCrudPersistFailureMetric:
    Type: AWS::Logs::MetricFilter
    Properties:
      LogGroupName: !Ref EdgeCrudLogGroup
      FilterPattern: 'CIRCUIT_BREAKER_PERSIST_FAILED'
      MetricTransformations:
        - MetricNamespace: !Sub 'WarmReach/${Environment}'
          MetricName: CircuitBreakerPersistFailures
          MetricValue: '1'
          DefaultValue: 0

  RagstackOpsPersistFailureMetric:
    Type: AWS::Logs::MetricFilter
    Properties:
      LogGroupName: !Ref RagstackOpsLogGroup
      FilterPattern: 'CIRCUIT_BREAKER_PERSIST_FAILED'
      MetricTransformations:
        - MetricNamespace: !Sub 'WarmReach/${Environment}'
          MetricName: CircuitBreakerPersistFailures
          MetricValue: '1'
          DefaultValue: 0

  # No CloudWatch alarm on this metric in the community edition: it ships no SNS
  # alerting stack at all (no AlarmNotificationEmail parameter, no topic, and no
  # other AWS::CloudWatch::Alarm), so an alarm here would have nowhere to send.
  # The metric is published regardless, so an operator running this template can
  # attach their own alarm to WarmReach/<env> CircuitBreakerPersistFailures.

  # --- WebSocket Connect ---
  WebSocketConnectFunction:
    Type: AWS::Serverless::Function
    DependsOn: WebSocketConnectLogGroup
    Properties:
      FunctionName: !Sub 'warmreach-ws-connect-${Environment}'
      CodeUri: lambdas/websocket-connect/
      Handler: lambda_function.lambda_handler
      Timeout: 10
      Role: !GetAtt WebSocketManageConnectionsRole.Arn
      Environment:
        Variables:
          DYNAMODB_TABLE_NAME: !Ref ProfilesTable
          LOG_LEVEL: INFO
          COGNITO_USER_POOL_ID: !Ref UserPool
          COGNITO_REGION: !Ref AWS::Region
          WEBSOCKET_ENDPOINT: !Sub 'https://${WebSocketApi}.execute-api.${AWS::Region}.amazonaws.com/${Environment}'

  WebSocketConnectPermission:
    Type: AWS::Lambda::Permission
    Properties:
      Action: lambda:InvokeFunction
      FunctionName: !Ref WebSocketConnectFunction
      Principal: apigateway.amazonaws.com
      SourceArn: !Sub 'arn:aws:execute-api:${AWS::Region}:${AWS::AccountId}:${WebSocketApi}/*/$connect'

  WebSocketConnectIntegration:
    Type: AWS::ApiGatewayV2::Integration
    Properties:
      ApiId: !Ref WebSocketApi
      IntegrationType: AWS_PROXY
      IntegrationUri: !Sub 'arn:aws:apigateway:${AWS::Region}:lambda:path/2015-03-31/functions/${WebSocketConnectFunction.Arn}/invocations'

  WebSocketConnectRoute:
    Type: AWS::ApiGatewayV2::Route
    Properties:
      ApiId: !Ref WebSocketApi
      RouteKey: $connect
      AuthorizationType: NONE
      Target: !Sub 'integrations/${WebSocketConnectIntegration}'

  # --- WebSocket Disconnect ---
  WebSocketDisconnectFunction:
    Type: AWS::Serverless::Function
    DependsOn: WebSocketDisconnectLogGroup
    Properties:
      FunctionName: !Sub 'warmreach-ws-disconnect-${Environment}'
      CodeUri: lambdas/websocket-disconnect/
      Handler: lambda_function.lambda_handler
      Timeout: 10
      Role: !GetAtt WebSocketManageConnectionsRole.Arn
      Environment:
        Variables:
          DYNAMODB_TABLE_NAME: !Ref ProfilesTable
          LOG_LEVEL: INFO
          WEBSOCKET_ENDPOINT: !Sub 'https://${WebSocketApi}.execute-api.${AWS::Region}.amazonaws.com/${Environment}'

  WebSocketDisconnectPermission:
    Type: AWS::Lambda::Permission
    Properties:
      Action: lambda:InvokeFunction
      FunctionName: !Ref WebSocketDisconnectFunction
      Principal: apigateway.amazonaws.com
      SourceArn: !Sub 'arn:aws:execute-api:${AWS::Region}:${AWS::AccountId}:${WebSocketApi}/*/$disconnect'

  WebSocketDisconnectIntegration:
    Type: AWS::ApiGatewayV2::Integration
    Properties:
      ApiId: !Ref WebSocketApi
      IntegrationType: AWS_PROXY
      IntegrationUri: !Sub 'arn:aws:apigateway:${AWS::Region}:lambda:path/2015-03-31/functions/${WebSocketDisconnectFunction.Arn}/invocations'

  WebSocketDisconnectRoute:
    Type: AWS::ApiGatewayV2::Route
    Properties:
      ApiId: !Ref WebSocketApi
      RouteKey: $disconnect
      Target: !Sub 'integrations/${WebSocketDisconnectIntegration}'

  # --- WebSocket Default ---
  WebSocketDefaultFunction:
    Type: AWS::Serverless::Function
    DependsOn: WebSocketDefaultLogGroup
    Properties:
      FunctionName: !Sub 'warmreach-ws-default-${Environment}'
      CodeUri: lambdas/websocket-default/
      Handler: lambda_function.lambda_handler
      Timeout: 29
      Role: !GetAtt WebSocketManageConnectionsRole.Arn
      Environment:
        Variables:
          DYNAMODB_TABLE_NAME: !Ref ProfilesTable
          LOG_LEVEL: INFO
          WEBSOCKET_ENDPOINT: !Sub 'https://${WebSocketApi}.execute-api.${AWS::Region}.amazonaws.com/${Environment}'

  WebSocketDefaultPermission:
    Type: AWS::Lambda::Permission
    Properties:
      Action: lambda:InvokeFunction
      FunctionName: !Ref WebSocketDefaultFunction
      Principal: apigateway.amazonaws.com
      SourceArn: !Sub 'arn:aws:execute-api:${AWS::Region}:${AWS::AccountId}:${WebSocketApi}/*/$default'

  WebSocketDefaultIntegration:
    Type: AWS::ApiGatewayV2::Integration
    Properties:
      ApiId: !Ref WebSocketApi
      IntegrationType: AWS_PROXY
      IntegrationUri: !Sub 'arn:aws:apigateway:${AWS::Region}:lambda:path/2015-03-31/functions/${WebSocketDefaultFunction.Arn}/invocations'

  WebSocketDefaultRoute:
    Type: AWS::ApiGatewayV2::Route
    Properties:
      ApiId: !Ref WebSocketApi
      RouteKey: $default
      Target: !Sub 'integrations/${WebSocketDefaultIntegration}'

  # ==========================================================================
  # Command Dispatch (HTTP API routes for command lifecycle)
  # ==========================================================================
  CommandDispatchFunction:
    Type: AWS::Serverless::Function
    DependsOn: CommandDispatchLogGroup
    Properties:
      FunctionName: !Sub 'warmreach-command-dispatch-${Environment}'
      CodeUri: lambdas/command-dispatch/
      Handler: lambda_function.lambda_handler
      Timeout: 10
      Role: !GetAtt WebSocketManageConnectionsRole.Arn
      Environment:
        Variables:
          DYNAMODB_TABLE_NAME: !Ref ProfilesTable
          LOG_LEVEL: INFO
          WEBSOCKET_ENDPOINT: !Sub 'https://${WebSocketApi}.execute-api.${AWS::Region}.amazonaws.com/${Environment}'
          ALLOWED_ORIGINS: !If
            - IncludeDevOriginsCondition
            - !Sub 'http://localhost:5173,http://localhost:3000,${ProductionOrigins}'
            - !Ref ProductionOrigins
      Events:
        CreateCommand:
          Type: HttpApi
          Properties:
            ApiId: !Ref HttpApi
            Path: /commands
            Method: POST
        GetCommand:
          Type: HttpApi
          Properties:
            ApiId: !Ref HttpApi
            Path: /commands/{commandId}
            Method: GET
        CommandsOptions:
          Type: HttpApi
          Properties:
            ApiId: !Ref HttpApi
            Path: /commands
            Method: OPTIONS
            Auth:
              Authorizer: NONE
        CommandIdOptions:
          Type: HttpApi
          Properties:
            ApiId: !Ref HttpApi
            Path: /commands/{commandId}
            Method: OPTIONS
            Auth:
              Authorizer: NONE

  # LinkedIn Action Gate — reserves the shared li-actions quota bucket before
  # creating the command in-process via command_dispatch_core (no Lambda hop). In
  # the community edition the QuotaService is a no-op stub, so this is a thin
  # passthrough; the frontend uses one path in both editions.
  LinkedinActionGateFunction:
    Type: AWS::Serverless::Function
    DependsOn: LinkedinActionGateLogGroup
    Properties:
      FunctionName: !Sub 'warmreach-linkedin-action-gate-${Environment}'
      CodeUri: lambdas/linkedin-action-gate/
      Handler: lambda_function.lambda_handler
      Timeout: 15
      MemorySize: 256
      Environment:
        Variables:
          WEBSOCKET_ENDPOINT: !Sub 'https://${WebSocketApi}.execute-api.${AWS::Region}.amazonaws.com/${Environment}'
      Policies:
        - DynamoDBCrudPolicy:
            TableName: !Ref ProfilesTable
        # In-process command dispatch performs the WebSocket send that used to
        # live in command-dispatch, so the gate needs execute-api:ManageConnections
        # scoped to this stack's WebSocket API stage (mirrors
        # WebSocketManageConnectionsRole / command-dispatch). DynamoDBCrudPolicy
        # already authorizes the TransactWriteItems used by the atomic reserve.
        - Statement:
            - Effect: Allow
              Action:
                - execute-api:ManageConnections
              Resource: !Sub 'arn:aws:execute-api:${AWS::Region}:${AWS::AccountId}:${WebSocketApi}/${Environment}/*'
      Events:
        LinkedinActionsApi:
          Type: HttpApi
          Properties:
            ApiId: !Ref HttpApi
            Path: /linkedin-actions
            Method: POST
        LinkedinActionsOptions:
          Type: HttpApi
          Properties:
            ApiId: !Ref HttpApi
            Path: /linkedin-actions
            Method: OPTIONS
            Auth:
              Authorizer: NONE

  # (Pro-only, intentionally excluded from the community edition: WarmReach Pro
  # also grants this function states:SendTaskSuccess + a LambdaInvokePolicy and an
  # AGENT_STATE_MACHINE_ARN env so it can release agent connect-action
  # confirmations against the per-action Step Functions state machine. The
  # community edition ships no autonomous agent, its state machine, or the
  # agent-action / opportunity-reconciler Lambdas.)
  EdgeCrudFunction:
    Type: AWS::Serverless::Function
    DependsOn: EdgeCrudLogGroup
    Properties:
      FunctionName: !Sub 'warmreach-edge-crud-${Environment}'
      CodeUri: lambdas/edge-crud/
      Handler: lambda_function.lambda_handler
      Timeout: 30
      Environment:
        Variables:
          RAGSTACK_GRAPHQL_ENDPOINT: !If
            - DeployRAGStackCondition
            - !GetAtt RAGStackNestedStack.Outputs.GraphQLApiUrl
            - !Ref RagstackGraphqlEndpoint
          # With RagstackApiKeyArn set, no plaintext key reaches the function
          # configuration at all; the handler fetches it from SSM at runtime.
          # Blank keeps the previous behaviour so the change is
          # deploy-order-independent (the handler warns when it falls back).
          RAGSTACK_API_KEY_ARN: !Ref RagstackApiKeyArn
          RAGSTACK_API_KEY: !If
            - HasRagstackApiKeyArn
            - ''
            - !If
              - DeployRAGStackCondition
              - !GetAtt RAGStackNestedStack.Outputs.GraphQLApiKey
              - !Ref RagstackApiKey
      Policies:
        # Scoped to the single RAGStack key parameter — never '*'. Attached only
        # when the ARN is configured, so a blank parameter grants nothing.
        - !If
          - HasRagstackApiKeyArn
          - Statement:
              - Effect: Allow
                Action:
                  - ssm:GetParameter
                Resource:
                  - !Ref RagstackApiKeyArn
          - !Ref AWS::NoValue
        - DynamoDBCrudPolicy:
            TableName: !Ref ProfilesTable
      Events:
        EdgeApi:
          Type: HttpApi
          Properties:
            ApiId: !Ref HttpApi
            Path: /edges
            Method: POST
        EdgeOptionsApi:
          Type: HttpApi
          Properties:
            ApiId: !Ref HttpApi
            Path: /edges
            Method: OPTIONS
            Auth:
              Authorizer: NONE

  # The admin dashboard is pro-only too, so this template declares none of its
  # infrastructure: no AdminMetricsFunction, no CloudFront distribution, and no
  # `warmreach-admin-cf-logs-*` bucket. If you are looking for the S3 ownership
  # and logging rules that bucket carries, they live in the pro template only.
  #
  # Pro-only Lambdas excluded from the community sync, so they intentionally do
  # NOT appear here:
  #   - AnalyticsInsightsFunction (POST /analytics)
  #   - OpportunitiesFunction (POST /opportunities)
  #   - OpportunityAgentFunction (POST /opportunity-agent; carries states:*)
  #   - GoalIntelligenceFunction (POST /goal-intelligence; SSM for the OpenAI key)
  #   - NetworkIntelligenceFunction (POST /network-intelligence)
  #
  # AnalyticsInsightsFunction used to be declared here with
  # `CodeUri: lambdas/analytics-insights/`, a directory that exclude_paths
  # removes — so `sam build` could not succeed in this edition, and the
  # community tier stub advertised the features it served. Both are gone: the
  # declaration here, and the `true` values in features/tier/index.ts.

  RagstackOpsFunction:
    Type: AWS::Serverless::Function
    DependsOn: RagstackOpsLogGroup
    Properties:
      FunctionName: !Sub 'warmreach-ragstack-ops-${Environment}'
      CodeUri: lambdas/ragstack-ops/
      Handler: lambda_function.lambda_handler
      Timeout: 30
      Environment:
        Variables:
          RAGSTACK_GRAPHQL_ENDPOINT: !If
            - DeployRAGStackCondition
            - !GetAtt RAGStackNestedStack.Outputs.GraphQLApiUrl
            - !Ref RagstackGraphqlEndpoint
          # With RagstackApiKeyArn set, no plaintext key reaches the function
          # configuration at all; the handler fetches it from SSM at runtime.
          # Blank keeps the previous behaviour so the change is
          # deploy-order-independent (the handler warns when it falls back).
          RAGSTACK_API_KEY_ARN: !Ref RagstackApiKeyArn
          RAGSTACK_API_KEY: !If
            - HasRagstackApiKeyArn
            - ''
            - !If
              - DeployRAGStackCondition
              - !GetAtt RAGStackNestedStack.Outputs.GraphQLApiKey
              - !Ref RagstackApiKey
      Policies:
        # Scoped to the single RAGStack key parameter — never '*'. Attached only
        # when the ARN is configured, so a blank parameter grants nothing.
        - !If
          - HasRagstackApiKeyArn
          - Statement:
              - Effect: Allow
                Action:
                  - ssm:GetParameter
                Resource:
                  - !Ref RagstackApiKeyArn
          - !Ref AWS::NoValue
        - DynamoDBCrudPolicy:
            TableName: !Ref ProfilesTable
      Events:
        RagstackApi:
          Type: HttpApi
          Properties:
            ApiId: !Ref HttpApi
            Path: /ragstack
            Method: POST
        RagstackOptionsApi:
          Type: HttpApi
          Properties:
            ApiId: !Ref HttpApi
            Path: /ragstack
            Method: OPTIONS
            Auth:
              Authorizer: NONE

  # Billing is pro-only and excluded from the community sync, so it does NOT
  # appear here:
  #   - BillingApiFunction (POST /billing; Stripe checkout + subscription
  #     management, carries the Stripe secret and its ssm:GetParameter grant)
  # Its StripePriceTierMap parameter (the Stripe price -> tier allowlist that
  # drives Starter/Pro entitlements) is likewise pro-only and absent here.
  # WarmReach Pro peeled these ops out of dynamodb-api so that every Stripe
  # dependency and credential is scoped to one function. The community
  # dynamodb-api below therefore needs no Stripe dependency, secret, or IAM.
  DynamoDBApiFunction:
    Type: AWS::Serverless::Function
    DependsOn: DynamoDBApiLogGroup
    Properties:
      FunctionName: !Sub 'warmreach-dynamodb-api-${Environment}'
      CodeUri: lambdas/dynamodb-api/
      Handler: lambda_function.lambda_handler
      Environment:
        Variables:
          COGNITO_USER_POOL_ID: !Ref UserPool
          COGNITO_REGION: !Ref AWS::Region
      Policies:
        - DynamoDBCrudPolicy:
            TableName: !Ref ProfilesTable
      Events:
        DynamoDBGet:
          Type: HttpApi
          Properties:
            ApiId: !Ref HttpApi
            Path: /dynamodb
            Method: GET
        DynamoDBPost:
          Type: HttpApi
          Properties:
            ApiId: !Ref HttpApi
            Path: /dynamodb
            Method: POST
        DynamoDBOptions:
          Type: HttpApi
          Properties:
            ApiId: !Ref HttpApi
            Path: /dynamodb
            Method: OPTIONS
            Auth:
              Authorizer: NONE
        ProfileGet:
          Type: HttpApi
          Properties:
            ApiId: !Ref HttpApi
            Path: /profiles
            Method: GET
        ProfilePost:
          Type: HttpApi
          Properties:
            ApiId: !Ref HttpApi
            Path: /profiles
            Method: POST
        ProfileOptions:
          Type: HttpApi
          Properties:
            ApiId: !Ref HttpApi
            Path: /profiles
            Method: OPTIONS
            Auth:
              Authorizer: NONE

  LLMFunction:
    Type: AWS::Serverless::Function
    DependsOn: LLMLogGroup
    Properties:
      # Async invocations retry twice and then vanish. This function is
      # invoked asynchronously, so without a DLQ a failed run leaves nothing to
      # find. The community edition has no alarm stack, so nothing watches this
      # queue automatically — but the failed payload is at least recoverable.
      DeadLetterQueue:
        Type: SQS
        TargetArn: !GetAtt LLMDLQ.Arn
      FunctionName: !Sub 'warmreach-llm-${Environment}'
      CodeUri: lambdas/llm/
      Handler: lambda_function.lambda_handler
      Timeout: 90
      MemorySize: 512
      Environment:
        Variables:
          OPENAI_API_KEY_ARN: !Ref OpenAIApiKeyArn
      Policies:
        - DynamoDBCrudPolicy:
            TableName: !Ref ProfilesTable
        - Statement:
            - Effect: Allow
              Action:
                - ssm:GetParameter
              Resource:
                - !Ref OpenAIApiKeyArn
      Events:
        LLMApi:
          Type: HttpApi
          Properties:
            ApiId: !Ref HttpApi
            Path: /llm
            Method: POST
        LLMOptionsApi:
          Type: HttpApi
          Properties:
            ApiId: !Ref HttpApi
            Path: /llm
            Method: OPTIONS
            Auth:
              Authorizer: NONE

  # ==========================================================================
  # Research Reconciler (scheduled) - makes deep-research results durable even
  # when no browser is polling. Scans in-progress RESEARCH# rows, reconciles
  # them against OpenAI, and mirrors completed content to the profile.
  # See lambdas/llm/reconcile_handler.py. Runtime/Layers/DYNAMODB_TABLE_NAME
  # are inherited from Globals.Function.
  # ==========================================================================
  ResearchReconcilerFunction:
    Type: AWS::Serverless::Function
    DependsOn: ResearchReconcilerLogGroup
    Properties:
      # Async invocations retry twice and then vanish. This function is
      # invoked asynchronously, so without a DLQ a failed run leaves nothing to
      # find. The community edition has no alarm stack, so nothing watches this
      # queue automatically — but the failed payload is at least recoverable.
      DeadLetterQueue:
        Type: SQS
        TargetArn: !GetAtt ResearchReconcilerDLQ.Arn
      FunctionName: !Sub 'warmreach-research-reconciler-${Environment}'
      CodeUri: lambdas/llm/
      Handler: reconcile_handler.lambda_handler
      Timeout: 300
      MemorySize: 512
      Environment:
        Variables:
          OPENAI_API_KEY_ARN: !Ref OpenAIApiKeyArn
      Policies:
        - DynamoDBCrudPolicy:
            TableName: !Ref ProfilesTable
        - Statement:
            - Effect: Allow
              Action:
                - ssm:GetParameter
              Resource:
                - !Ref OpenAIApiKeyArn
      Events:
        ResearchPollSchedule:
          Type: Schedule
          Properties:
            Schedule: 'rate(5 minutes)'
            Description: 'Reconcile in-progress deep-research jobs against OpenAI'
            Enabled: true

  # Public endpoint returning per-platform desktop client download URLs.
  ClientDownloadsFunction:
    Type: AWS::Serverless::Function
    DependsOn: ClientDownloadsLogGroup
    Properties:
      FunctionName: !Sub 'warmreach-client-downloads-${Environment}'
      CodeUri: lambdas/client-downloads/
      Handler: lambda_function.lambda_handler
      Timeout: 5
      MemorySize: 256
      Environment:
        Variables:
          CLIENT_DOWNLOAD_MAC: !Ref ClientDownloadMacUrl
          CLIENT_DOWNLOAD_WIN: !Ref ClientDownloadWinUrl
          CLIENT_DOWNLOAD_LINUX: !Ref ClientDownloadLinuxUrl
          CLIENT_DOWNLOAD_VERSION: !Ref ClientDownloadVersion
      # s3:GetObject only when an operator actually points a ClientDownload*Url
      # at s3://, and then only at the bucket they named. This endpoint is
      # public and unauthenticated (Authorizer: NONE below), so an unscoped
      # grant would give it account-wide object read for a capability most
      # deployments never use — https:// URLs need no S3 access at all.
      # Changing buckets now needs a redeploy, which is the intended trade.
      Policies:
        - !If
          - HasClientDownloadBucket
          - Statement:
              - Effect: Allow
                Action:
                  - s3:GetObject
                Resource: !Sub 'arn:${AWS::Partition}:s3:::${ClientDownloadBucket}/*'
          - !Ref 'AWS::NoValue'
      Events:
        ClientDownloadsApi:
          Type: HttpApi
          Properties:
            ApiId: !Ref HttpApi
            Path: /client-downloads
            Method: GET
            Auth:
              Authorizer: NONE
        ClientDownloadsOptions:
          Type: HttpApi
          Properties:
            ApiId: !Ref HttpApi
            Path: /client-downloads
            Method: OPTIONS
            Auth:
              Authorizer: NONE

  LLMDLQ:
    Type: AWS::SQS::Queue
    Properties:
      QueueName: !Sub 'warmreach-llm-dlq-${Environment}'
      MessageRetentionPeriod: 1209600

  ResearchReconcilerDLQ:
    Type: AWS::SQS::Queue
    Properties:
      QueueName: !Sub 'warmreach-research-reconciler-dlq-${Environment}'
      MessageRetentionPeriod: 1209600

Outputs:
  ApiUrl:
    Description: API Gateway endpoint URL
    Value: !Sub 'https://${HttpApi}.execute-api.${AWS::Region}.amazonaws.com/${Environment}'
  UserPoolId:
    Description: Cognito User Pool ID
    Value: !Ref UserPool
  UserPoolClientId:
    Description: Cognito User Pool Client ID
    Value: !Ref UserPoolClient
  DynamoDBTableName:
    Description: DynamoDB table name
    Value: !Ref ProfilesTable
  WebSocketApiUrl:
    Description: WebSocket API endpoint URL
    Value: !Sub 'wss://${WebSocketApi}.execute-api.${AWS::Region}.amazonaws.com/${Environment}'
  # RAGStack Outputs (only available when DeployRAGStack=true)
  RAGStackGraphQLEndpoint:
    Condition: DeployRAGStackCondition
    Description: RAGStack GraphQL API endpoint for semantic search
    Value: !GetAtt RAGStackNestedStack.Outputs.GraphQLApiUrl
  RAGStackDashboardUrl:
    Condition: DeployRAGStackCondition
    Description: RAGStack Dashboard URL for document management
    Value: !GetAtt RAGStackNestedStack.Outputs.UIUrl
