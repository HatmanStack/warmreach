[pytest]
testpaths = .
python_files = test_*.py
python_classes = Test*
python_functions = test_*
# --cov-fail-under=82, measured 2026-07-27, rule: floor(actual) - 1.
#
# This file syncs verbatim to the community edition, and the two editions have
# different actuals because they build from different Lambda sets: pro 87.10%
# (1919 tests), community 83.15% (772 tests). 82 is the community figure minus
# one, which is the highest number BOTH editions satisfy. The old 75 left 12
# points of silent regression headroom against pro and 8 against community.
#
# Pro CI is stricter than this. .github/workflows/ci.yml's backend job passes
# --cov-fail-under=86 on the command line (floor(87.10) - 1), which overrides
# this addopt, so pro gets its own current-minus-one without breaking the
# community run that shares this file. Both numbers carry their measured actual
# and their date; update them together.
addopts = -v --tb=short --cov=../../backend/lambdas --cov-report=term --cov-fail-under=82
markers =
    integration: requires MiniStack
filterwarnings =
    ignore::DeprecationWarning
